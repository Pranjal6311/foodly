  <script>

<body class="bg-background text-on-background antialiased min-h-screen flex flex-col font-sans selection:bg-primary-fixed selection:text-primary">
  <!-- Foodly Premium Starting Logo Animation Splash Screen -->
  <div id="foodly-splash-screen" class="foodly-splash-overlay" onclick="window.dismissFoodlySplash && window.dismissFoodlySplash()" title="Click to enter Foodly">
    <div class="foodly-splash-glow"></div>
    <div class="foodly-splash-container">
      <!-- Animated Logo Wrapper -->
      <div class="foodly-splash-logo-wrapper">
        <img src="./images/foodly-logo.png" alt="Foodly — Fast Fresh Food, Delivered" class="foodly-splash-logo-img"/>
        <div class="foodly-splash-shimmer-sweep"></div>
        <div class="foodly-pin-pulse"></div>
      </div>

      <!-- Tagline & Campus Badge -->
      <div class="foodly-splash-text-group">
        <div class="foodly-splash-tagline">Fast Fresh Food, Delivered</div>
        <div class="foodly-splash-campus-pill">
          <span class="foodly-live-dot"></span>
          <span>GL Bajaj Campus Express • Live GPS</span>
        </div>
      </div>

      <!-- Sleek Progress Loader Line -->
      <div class="foodly-splash-loader-bar">
        <div class="foodly-splash-loader-fill"></div>
      </div>
      <p style="font-size:10px;color:#9ca3af;margin-top:12px;font-weight:600;letter-spacing:0.04em;">Tap anywhere to enter</p>
    </div>
  </div>

  <script>
    (function () {
      function dismissSplash() {
        var splash = document.getElementById('foodly-splash-screen');
        if (!splash || splash.classList.contains('splash-hide')) return;
        splash.classList.add('splash-hide');
        setTimeout(function () {
          if (splash) splash.style.display = 'none';
        }, 500);
      }
      window.dismissFoodlySplash = dismissSplash;
      window.playFoodlySplash = function (e) {
        if (e && e.preventDefault) e.preventDefault();
        var splash = document.getElementById('foodly-splash-screen');
        if (!splash) return;
        splash.style.display = 'flex';
        splash.classList.remove('splash-hide');
        setTimeout(dismissSplash, 1600);
      };

      // Auto dismiss initial splash after 1.4s
      if (document.readyState === 'complete') {
        setTimeout(dismissSplash, 1400);
      } else {
        window.addEventListener('load', function () { setTimeout(dismissSplash, 1400); });
        setTimeout(dismissSplash, 2200);
      }
    })();
  </script>

  <!-- Shared Top Navigation -->
  <header id="navbar-container" class="fixed top-0 w-full z-40 transition-all"></header>

  <!-- Main View Router Container -->
  <main id="app" class="flex-grow pt-20 md:pt-24 pb-20 md:pb-8 min-h-[70vh]"></main>

  <!-- Swiggy / Zomato Signature Mobile Floating Mini Cart Bar -->
  <div id="mobile-floating-cart-bar" class="hidden md:hidden fixed bottom-16 left-3 right-3 z-40 bg-gradient-to-r from-emerald-700 via-teal-800 to-emerald-950 text-white rounded-2xl p-3 shadow-2xl flex items-center justify-between border-2 border-emerald-400/50 backdrop-blur-md">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-white/20 border border-white/30 flex items-center justify-center font-black text-xs shadow-inner" id="mobile-cart-count-badge">
        0

      <div>
        <div class="flex items-baseline gap-1.5">

          <span class="text-[10px] text-emerald-200 uppercase font-bold tracking-wider">• Campus Free Drop</span>
        </div>

  <!-- Mobile Bottom Navigation Bar — Premium Swiggy/Zomato Style -->
  <nav id="mobile-bottom-nav" class="md:hidden fixed bottom-0 left-0 right-0 z-40" style="background:rgba(255,255,255,0.97);backdrop-filter:blur(20px) saturate(200%);-webkit-backdrop-filter:blur(20px) saturate(200%);border-top:1px solid rgba(220,226,243,0.8);box-shadow:0 -2px 20px rgba(0,0,0,0.08);display:flex;justify-content:space-around;align-items:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));">
    <a href="#home" id="mob-nav-home" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 12px;border-radius:12px;text-decoration:none;transition:all 0.15s ease;">
      <span class="material-symbols-outlined" style="font-size:22px;">electric_moped</span>
      <span style="font-size:10px;font-weight:800;">Delivery</span>
    </a>
    <a href="#search" id="mob-nav-dining" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 12px;border-radius:12px;text-decoration:none;transition:all 0.15s ease;">
      <span class="material-symbols-outlined" style="font-size:22px;">restaurant</span>
      <span style="font-size:10px;font-weight:800;">Dining</span>
    </a>
    <button onclick="window.openFoodlyAiAssistant ? window.openFoodlyAiAssistant() : location.hash='#innovations'" id="mob-nav-ai" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 12px;border-radius:12px;border:none;background:transparent;cursor:pointer;transition:all 0.15s ease;color:#7c3aed;">
      <span class="material-symbols-outlined animate-pulse" style="font-size:22px;color:#7c3aed;">auto_awesome</span>
      <span style="font-size:10px;font-weight:800;color:#7c3aed;">Foodly AI</span>
    </button>
    <a href="#orders" id="mob-nav-orders" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 12px;border-radius:12px;text-decoration:none;transition:all 0.15s ease;">
      <span class="material-symbols-outlined" style="font-size:22px;">receipt_long</span>
      <span style="font-size:10px;font-weight:800;">Orders</span>
    </a>
    <a href="#profile" id="mob-nav-profile" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 12px;border-radius:12px;text-decoration:none;transition:all 0.15s ease;">
      <span class="material-symbols-outlined" style="font-size:22px;">person</span>
      <span style="font-size:10px;font-weight:800;">Profile</span>
    </a>
  </nav>

  <!-- Bottom Nav Active State Script -->
  <script>
    function updateBottomNavActive() {
      const hash = window.location.hash || '#home';
      const active = 'color:#ff5e18;background:rgba(255,94,24,0.08);';
      const inactive = 'color:#575e70;background:transparent;';
      ['mob-nav-home','mob-nav-dining','mob-nav-ai','mob-nav-orders','mob-nav-profile'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.style.cssText = el.style.cssText.replace(/color:[^;]+;/g,'').replace(/background:[^;]+;/g,'');
      });
      const h = document.getElementById('mob-nav-home');
      const d = document.getElementById('mob-nav-dining');
      const o = document.getElementById('mob-nav-orders');
      const p = document.getElementById('mob-nav-profile');
      if (h && (hash === '#home' || hash === '' || hash.startsWith('#restaurant'))) { h.style.color='#ff5e18'; h.style.background='rgba(255,94,24,0.08)'; }
      else if (h) { h.style.color='#575e70'; h.style.background='transparent'; }
      if (d && hash.startsWith('#search')) { d.style.color='#ff5e18'; d.style.background='rgba(255,94,24,0.08)'; }
      else if (d) { d.style.color='#575e70'; d.style.background='transparent'; }
      if (o && (hash.startsWith('#orders') || hash.startsWith('#track'))) { o.style.color='#ff5e18'; o.style.background='rgba(255,94,24,0.08)'; }
      else if (o) { o.style.color='#575e70'; o.style.background='transparent'; }
      if (p && (hash === '#profile' || hash === '#settings')) { p.style.color='#ff5e18'; p.style.background='rgba(255,94,24,0.08)'; }
      else if (p) { p.style.color='#575e70'; p.style.background='transparent'; }
    }
    window.addEventListener('hashchange', updateBottomNavActive);
    window.addEventListener('load', updateBottomNavActive);
  </script>
